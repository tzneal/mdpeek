[package]
publish = false
name = "mdpeek"
version = "0.1.0"
edition = "2024"
description = "Progressive-disclosure CLI for markdown/text docs"
repository = "https://github.com/tzneal/mdpeek"
license = "MIT"

[package.metadata.dist]
dist = true

[package.metadata.release]
tag-name = "v{{version}}"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
ignore = "0.4.25"
pulldown-cmark = "0.13.3"
rayon = "1.12.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
tantivy = "0.26.0"
tempfile = "3.27.0"
tiktoken-rs = "0.11.0"

[dev-dependencies]
assert_cmd = "2.2.0"
predicates = "3.1.4"
tempfile = "3.27.0"

[profile.dist]
inherits = "release"
lto = "thin"
